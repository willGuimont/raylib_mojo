[package]
name = "raylib-shim"
version = "0.1.0"
description = "Builds the vendored raylib and raygui C libraries into the pixi environment as lib/libraylib.so and lib/libraygui.so"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
extra-input-globs = ["../third_party/raylib/**/*", "../third_party/raygui/**/*", "raygui_impl.c"]

[package.build-dependencies]
cmake = "*"
ninja = "*"
make = "*"

[package.target.linux-64.host-dependencies]
xorg-libx11 = ">=1.8.13,<2"
xorg-libxrandr = ">=1.5.5,<2"
xorg-libxinerama = ">=1.1.6,<2"
xorg-libxcursor = ">=1.2.3,<2"
xorg-libxi = ">=1.8.3,<2"
xorg-libxext = ">=1.3.7,<2"
xorg-xorgproto = ">=2025.1,<2026"
libgl-devel = ">=1.7.0,<2"
