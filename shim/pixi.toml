[package]
name = "raylib-shim"
version = "0.1.0"
description = "Builds the vendored raylib C library into the pixi environment as lib/libraylib.so"

[package.build]
backend = { name = "pixi-build-cmake", version = "*" }

[package.build.config]
# raylib itself lives in the workspace submodule, one level up from this package.
extra-input-globs = ["../third_party/raylib/**/*"]

[package.build-dependencies]
cmake = "*"
ninja = "*"
make = "*"

# X11/GL are what raylib links against on Linux. Declaring them here means a
# consumer that depends on raylib_mojo gets them transitively — they never have
# to list xorg packages in their own manifest.
[package.target.linux-64.host-dependencies]
xorg-libx11 = ">=1.8.13,<2"
xorg-libxrandr = ">=1.5.5,<2"
xorg-libxinerama = ">=1.1.6,<2"
xorg-libxcursor = ">=1.2.3,<2"
xorg-libxi = ">=1.8.3,<2"
xorg-libxext = ">=1.3.7,<2"
xorg-xorgproto = ">=2025.1,<2026"
libgl-devel = ">=1.7.0,<2"
